<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAUDAJI — Página no encontrada</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<script>
/* GitHub Pages muestra esta página cuando la dirección no existe. Antes de mostrarla
   intenta arreglar los tropiezos comunes al escribir o pegar un link:
   · mayúsculas:                 /Presskit   → /presskit.html
   · diagonal o punto al final:  /presskit/  → /presskit.html
   · otros nombres:              /press-kit, /epk, /fechas… (ver ALIAS)
   Si reconoce la página, manda directo a ella y esto ni se alcanza a ver.
   Las rutas de este archivo empiezan con "/" a propósito: la dirección que falló
   puede traer carpetas (/algo/otra-cosa) y las rutas relativas se romperían.
   Para agregar una página nueva al sitio: súmala a PAGINAS. */
(function () {
  var PAGINAS = ['presskit', 'rider', 'escucha', 'concierto', 'futuras', 'trabajo', 'liebre', 'tokin', 'admin'];
  var ALIAS = {
    'press-kit': 'presskit', 'press_kit': 'presskit', 'press': 'presskit', 'prensa': 'presskit',
    'epk': 'presskit', 'kit': 'presskit', 'saudaji-presskit': 'presskit',
    'raider': 'rider', 'rider-tecnico': 'rider',
    'escuchar': 'escucha', 'musica': 'escucha', 'música': 'escucha', 'music': 'escucha', 'listen': 'escucha', 'links': 'escucha',
    'fechas': 'concierto', 'fecha': 'concierto', 'conciertos': 'concierto', 'shows': 'concierto', 'show': 'concierto', 'en-vivo': 'concierto', 'envivo': 'concierto',
    'produccion': 'trabajo', 'producción': 'trabajo'
  };
  var INICIO = { '': '/', 'index': '/', 'inicio': '/', 'home': '/', 'contacto': '/#contacto', 'bio': '/#bio' };

  var ruta = location.pathname;
  try { ruta = decodeURIComponent(ruta); } catch (e) {}
  ruta = ruta.toLowerCase()
    .replace(/[\/\s.,;:!?)\]>"']+$/, '')   // diagonal, espacios o puntuación pegados al final
    .replace(/^\/+/, '')
    .replace(/\.(html?|pdf)$/, '');       // con o sin extensión

  var destino = null;
  if (INICIO.hasOwnProperty(ruta)) destino = INICIO[ruta];
  else if (ALIAS.hasOwnProperty(ruta)) destino = '/' + ALIAS[ruta] + '.html';
  else if (PAGINAS.indexOf(ruta) !== -1) destino = '/' + ruta + '.html';

  if (destino && destino !== location.pathname) {
    var cola = destino.indexOf('#') === -1 ? location.search + location.hash : '';
    location.replace(destino + cola);
  }
})();
</script>
<style>
  /* mismo look que futuras.html y trabajo.html */
  :root {
    --tinta: #1a1a1a;
    --tinta-suave: rgba(26, 26, 26, 0.62);
    --linea: rgba(26, 26, 26, 0.18);
    --bg: #ffffff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--tinta);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  a { color: inherit; text-decoration: none; }

  .home { position: absolute; top: 1.6rem; left: 2rem; }
  .home img { width: 150px; height: auto; display: block; }

  main {
    max-width: 440px;
    margin: 0 auto;
    padding: 9rem 1.5rem 4rem;
    text-align: center;
  }
  h1 { font-size: 13px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 0.6rem; }
  .texto { font-size: 17px; font-weight: 300; max-width: 360px; margin: 0 auto 2.2rem; }
  .boton {
    display: inline-block;
    background: var(--tinta);
    color: #fff;
    border: 1px solid var(--tinta);
    font-size: 11px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    padding: 1rem 2.5rem;
    transition: background 0.3s, color 0.3s;
  }
  .boton:hover { background: #fff; color: var(--tinta); }
  .otros { margin-top: 2.2rem; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--tinta-suave); }
  .otros a { position: relative; border-bottom: 1px solid var(--linea); margin: 0 0.6rem; transition: color 0.3s, border-color 0.3s; }
  .otros a::after { content: ""; position: absolute; inset: -0.8rem -0.4rem; }   /* área táctil */
  .otros a:hover { color: var(--tinta); border-color: var(--tinta); }

  @media (max-width: 600px) {
    .home { left: 1.2rem; top: 1.2rem; }
    .home img { width: 120px; }
    main { padding: 7rem 1.4rem 3rem; }
  }
</style>
</head>
<body>

<a class="home" href="/" aria-label="Ir a saudaji.com"><img src="/assets/logo.svg" alt="Saudaji"></a>

<main>
  <h1>Esta página no existe</h1>
  <p class="texto">Puede que el link esté mal escrito o que la página ya no esté.</p>
  <a class="boton" href="/">Ir al inicio</a>
  <p class="otros">
    <a href="/escucha.html">Escuchar</a>
    <a href="/concierto.html">Fechas</a>
    <a href="/#contacto">Contacto</a>
  </p>
</main>

</body>
</html>
